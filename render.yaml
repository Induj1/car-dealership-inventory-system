# Render blueprint: one service, built from the Dockerfile.
#
# Deploy by pointing Render at this repository; it reads this file. The disk
# keeps the SQLite database across deploys - without it, every deploy would
# start from an empty lot.
services:
  - type: web
    name: apex-motors
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/dealership.db
      - key: SERVE_SPA
        value: 'true'
      - key: SPA_DIST_PATH
        value: /app/frontend/dist
      - key: TRUST_PROXY
        value: 'true'
      - key: SEED_ADMIN_EMAIL
        value: admin@dealership.test
      # Set this yourself in the dashboard before going live.
      - key: SEED_ADMIN_PASSWORD
        sync: false
    disk:
      name: dealership-data
      mountPath: /var/data
      sizeGB: 1
